name: Test and check release metadata

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Regression tests
        run: python -B -m unittest discover -s tests -v
      - name: Check own release
        run: python -B -m release_preflight . --release 0.1.0 --strict
      - name: Build portable application
        run: python scripts/build_zipapp.py dist/release-preflight.pyz
      - name: Verify portable application
        run: python -B dist/release-preflight.pyz . --release 0.1.0 --strict --asset dist/release-preflight.pyz
